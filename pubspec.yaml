name: shogi_app
description: "将棋ボードゲーム。AI対局・ネットワーク対局・棋譜管理・手筋トレーニングを搭載。"
publish_to: 'none'

version: 1.1.2+13

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.0

  # ローカライズ / 日付フォーマット
  intl: ^0.20.2

  # 状態管理
  flutter_riverpod: ^2.6.1

  # 環境変数
  flutter_dotenv: ^5.2.1

  # 広告・課金
  google_mobile_ads: ^5.3.0
  in_app_purchase: ^3.2.0

  # Firebase（ネットワーク対局・報告機能）
  firebase_core: ^3.6.0
  firebase_database: ^11.1.0
  cloud_firestore: ^5.0.0
  firebase_auth: ^5.0.0
  firebase_messaging: ^15.0.0
  firebase_crashlytics: ^4.0.0
  network_info_plus: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.3.9
  build_runner: ^2.4.6

flutter:
  uses-material-design: true
