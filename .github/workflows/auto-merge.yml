name: Auto Merge PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
  check_suite:
    types: [completed]
  workflow_run:
    workflows: ["Build Signed Android App Bundle"]
    types: [completed]

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]' || github.event_name == 'workflow_run'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable auto-merge
        if: github.actor == 'dependabot[bot]'
        run: |
          gh pr merge --auto --squash "${{ github.event.pull_request.number }}" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-merge on CI success
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
        run: |
          PR_NUMBER=$(gh pr list --state open --json number -q ".[0].number")
          if [ ! -z "$PR_NUMBER" ]; then
            gh pr merge --auto --squash "$PR_NUMBER" || true
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
